<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>English Ex1</title>
<link rel="stylesheet" href="../style.css"></head>
<body>
  <header class="navbar container">
    <div class="logo">🌟 Tayebe</div>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="../about.html">About</a></li>

      <li><a href="../exercises.html" class="active">Exercises</a></li>
      <li><a href="../contact.html">Contact</a></li>
    </ul>
  </header>

  <main class="container section">
    <h1>English Exercise 1: Fill in the blanks</h1>
    <p>Complete the sentences with the correct word.</p>

    <form id="exerciseForm">
      <p>1) I ____ a student.</p>
      <label><input type="radio" name="q1" value="am"> am</label><br>
      <label><input type="radio" name="q1" value="is"> is</label><br>
      <label><input type="radio" name="q1" value="are"> are</label><br><br>

      <p>2) She ____ from Canada.</p>
      <label><input type="radio" name="q2" value="am"> am</label><br>
      <label><input type="radio" name="q2" value="is"> is</label><br>
      <label><input type="radio" name="q2" value="are"> are</label><br><br>

      <p>3) They ____ my friends.</p>
      <label><input type="radio" name="q3" value="am"> am</label><br>
      <label><input type="radio" name="q3" value="is"> is</label><br>
      <label><input type="radio" name="q3" value="are"> are</label><br><br>

      <button type="button" class="btn" onclick="check()">Check Answers</button>
    </form>

    <p id="result" style="margin-top:12px; font-weight:700"></p>
  </main>

  <footer><p>© 2025 Tayebe</p></footer>

<script>
function check(){
  let score = 0;
  try {
    if (document.querySelector('input[name="q1"]:checked').value === "am") score++;
    if (document.querySelector('input[name="q2"]:checked').value === "is") score++;
    if (document.querySelector('input[name="q3"]:checked').value === "are") score++;
  } catch(e) { /* ignore if no answer selected */ }
  document.getElementById("result").innerText = "Score: " + score + "/3";
}
</script>
</body></html>
