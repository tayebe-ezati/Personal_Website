<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 4 - Links & Images</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="container">
    <h1>Lesson 4: Links & Images</h1>
    <p>Learn how to add links and images to a webpage.</p>

    <!-- PREVIEW -->
    <div class="preview">
      <h1>Welcome to My Website</h1>
      <img src="myphoto.jpg" alt="My Photo" width="200">
      <p><a href="https://www.google.com">Visit Google</a></p>
    </div>

    <!-- CODE -->
    <div class="code-block">
      <h2>HTML Code</h2>
      <pre><code>
&lt;h1&gt;Welcome to My Website&lt;/h1&gt;
&lt;img src="myphoto.jpg" alt="My Photo" width="200"&gt;
&lt;p&gt;&lt;a href="https://www.google.com"&gt;Visit Google&lt;/a&gt;&lt;/p&gt;
      </code></pre>
    </div>
  </div>
</body>
</html>
