  <main class="container">
    <h1>HTML Lesson 5: Forms</h1>
    <h2>Contact Form Example</h2>
    <form action="#" method="post">
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" required><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="message">Message:</label><br>
      <textarea id="message" name="message"></textarea><br><br>

      <button class="btn" type="submit">Send</button>
    </form>
    <p style="margin-top:10px; color:#666">Note: This sample form uses no server here. For real submissions link to Google Forms or Formspree or Netlify Forms.</p>
  </main>
